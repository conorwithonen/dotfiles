# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Which is equivalent to

format = """
$username\
$hostname\
$localip\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$fill$python${custom.aws_session}$time\
\n$character"""

[directory]
truncation_length = 4
truncate_to_repo = true

[character]
success_symbol = '[ ->](bold green) '
error_symbol = '[ ->](bold red) '
vimcmd_symbol = "[ ->](bold green)"

[python]
format = '(\([$virtualenv]($style)\) )'
style = "bold red"
detect_extensions = []

# Profile, cloud, and login time are one segment. $duration stays empty for aws login,
# and putting it in this format prints "[]".
[aws]
disabled = true

[custom.aws_session]
description = "Cloud, profile, and aws login time"
when = true
shell = ["zsh", "-f"]
use_stdin = true
command = '. /Users/conor.manning/dotfiles/bin/aws-login-remaining.zsh'
# Nerd-font cloud is one cell wide. The emoji cloud is two cells in the terminal
# and one cell to Starship, so $fill wraps and leaves a blank line above ->.
format = '([  $output ]($style))'
style = "bold yellow"

[fill]
symbol = ' '

[time]
disabled = false
time_format = "%R"
utc_time_offset = "local"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'
